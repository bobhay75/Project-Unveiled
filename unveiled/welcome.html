<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>You’re Confirmed | The 7-Day Unveiled Journey</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0d0f12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/unveiled-journey.css">
  <style>
    .confirmation-shell{min-height:100vh;display:grid;place-items:center;padding:2rem;background:radial-gradient(circle at 50% 35%,rgba(210,168,79,.14),transparent 28rem)}
    .confirmation-card{width:min(720px,100%);padding:clamp(2rem,7vw,5rem);border:1px solid var(--line);background:linear-gradient(150deg,rgba(30,35,41,.98),rgba(13,16,20,.99));text-align:center;box-shadow:0 35px 90px rgba(0,0,0,.38)}
    .confirmation-card .symbol{color:var(--gold);font-size:1.2rem}.confirmation-card h1{margin:.8rem 0 1.2rem;font:600 clamp(3rem,9vw,6rem)/.9 var(--serif);letter-spacing:-.04em}.confirmation-card h1 em{display:block;color:var(--gold-light);font-style:normal}.confirmation-card>p{max-width:560px;margin:1rem auto;color:#cfc7b9}
  </style>
</head>
<body>
  <main class="confirmation-shell">
    <section class="confirmation-card" aria-labelledby="welcome-title">
      <div class="symbol" aria-hidden="true">◆</div>
      <p class="eyebrow">You are confirmed</p>
      <h1 id="welcome-title">The door <em>is open.</em></h1>
      <p>Day One is queued and normally arrives within an hour. Add <strong>noreply@bobsome1.com</strong> to your contacts and check Spam or Promotions if you do not see it.</p>
      <p>While you wait, you can begin reading Project Unveiled now.</p>
      <p><a class="gold-button" href="/book/read/">Read the Book <span aria-hidden="true">→</span></a></p>
    </section>
  </main>
</body>
</html>
