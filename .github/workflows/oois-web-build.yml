name: OOIS Web Build
on:
  push:
    branches: [build/oois-field-mapper]
    paths: ['oois/field-mapper/**', '.github/workflows/oois-web-build.yml']
  pull_request:
    paths: ['oois/field-mapper/**', '.github/workflows/oois-web-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oois/field-mapper
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Check field data and build
        run: npm test && npm run build
