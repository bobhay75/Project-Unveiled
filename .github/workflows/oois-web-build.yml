name: OOIS Web Build
on:
  push:
    branches: [build/oois-field-mapper]
    paths: ['oois/field-mapper/**', '.github/workflows/oois-web-build.yml']
  pull_request:
    paths: ['oois/field-mapper/**', '.github/workflows/oois-web-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oois/field-mapper
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Check field data and build
        run: npm test && npm run build
  cloud-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Install isolated emulator test dependencies
        working-directory: oois/field-mapper/tests/cloud
        run: npm ci --ignore-scripts
      - name: Verify owner isolation and private photo rules
        working-directory: oois/field-mapper/tests/cloud
        env:
          CI: 'true'
        run: npm test
  android-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: oois/field-mapper
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare device-only preview
        env:
          VITE_ENABLE_FIREBASE: 'false'
        run: |
          npm ci
          npm run build
          node scripts/prepare-android.mjs --preview
      - name: Compile and lint native Android app
        working-directory: oois/field-mapper/android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Package test APK
        run: |
          mkdir -p preview-package
          cp android/app/build/outputs/apk/debug/app-debug.apk preview-package/OOIS-Field-Mapper-Preview.apk
          cp ANDROID-TESTING.md preview-package/ANDROID-TESTING.md
          cd preview-package
          sha256sum OOIS-Field-Mapper-Preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OOIS-Android-Preview
          path: oois/field-mapper/preview-package/
          if-no-files-found: error
          retention-days: 7
