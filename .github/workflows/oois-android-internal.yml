name: OOIS Signed Internal Bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Play version code
        required: true
        default: "1"
        type: string
      version_name:
        description: Human-readable semantic version
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: oois-internal
    defaults:
      run:
        working-directory: oois/field-mapper
    env:
      VITE_ENABLE_FIREBASE: "true"
      VITE_FIREBASE_API_KEY: ${{ vars.OOIS_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.OOIS_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.OOIS_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.OOIS_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_APP_ID: ${{ vars.OOIS_FIREBASE_APP_ID }}
      OOIS_EXPECTED_PROJECT_ID: ${{ vars.OOIS_FIREBASE_PROJECT_ID }}
      OOIS_VERSION_CODE: ${{ inputs.version_code }}
      OOIS_VERSION_NAME: ${{ inputs.version_name }}
      OOIS_UPLOAD_KEYSTORE: ${{ runner.temp }}/oois-upload.jks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Materialize owner-controlled upload key
        shell: bash
        env:
          OOIS_UPLOAD_KEYSTORE_B64: ${{ secrets.OOIS_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$OOIS_UPLOAD_KEYSTORE_B64"
          umask 077
          printf '%s' "$OOIS_UPLOAD_KEYSTORE_B64" | base64 --decode > "$OOIS_UPLOAD_KEYSTORE"
      - name: Validate release configuration
        run: |
          npm ci
          npm run release:check
      - name: Build unsigned production bundle
        run: |
          npm run build
          node scripts/prepare-android.mjs
          cd android
          ./gradlew --no-daemon bundleRelease lintRelease
      - name: Sign, verify and package AAB
        shell: bash
        env:
          OOIS_UPLOAD_STORE_PASSWORD: ${{ secrets.OOIS_UPLOAD_STORE_PASSWORD }}
          OOIS_UPLOAD_KEY_ALIAS: ${{ secrets.OOIS_UPLOAD_KEY_ALIAS }}
          OOIS_UPLOAD_KEY_PASSWORD: ${{ secrets.OOIS_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          test -n "$OOIS_UPLOAD_STORE_PASSWORD"
          test -n "$OOIS_UPLOAD_KEY_ALIAS"
          test -n "$OOIS_UPLOAD_KEY_PASSWORD"
          keytool -list -keystore "$OOIS_UPLOAD_KEYSTORE" -alias "$OOIS_UPLOAD_KEY_ALIAS" -storepass:env OOIS_UPLOAD_STORE_PASSWORD >/dev/null
          jarsigner -keystore "$OOIS_UPLOAD_KEYSTORE" -storepass:env OOIS_UPLOAD_STORE_PASSWORD -keypass:env OOIS_UPLOAD_KEY_PASSWORD "$aab" "$OOIS_UPLOAD_KEY_ALIAS"
          verification="$(jarsigner -verify "$aab" 2>&1)"
          grep -qi "jar verified" <<<"$verification"
          mkdir -p internal-package
          cp "$aab" "internal-package/OOIS-Field-Mapper-${OOIS_VERSION_NAME}-internal.aab"
          cp PLAY-INTERNAL-TEST.md internal-package/
          cd internal-package
          sha256sum "OOIS-Field-Mapper-${OOIS_VERSION_NAME}-internal.aab" > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OOIS-Play-Internal-${{ inputs.version_name }}
          path: oois/field-mapper/internal-package/
          if-no-files-found: error
          retention-days: 14
