name: Site safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit secrets and workflow permissions
        run: python3 scripts/security-audit.py --history

      - name: Validate deployment safety policy
        env:
          DEPLOYMENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-deployment-safety.py --base "${DEPLOYMENT_BASE_SHA:-}"

      - name: Test guarded cPanel deployment
        run: bash tests/deployment/run.sh

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path './.git' -prune -o -type f -name '*.php' -print0)

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path './.git' -prune -o -type f -name '*.js' -print0)

      - name: Verify Journey evidence gates
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/project-unveiled-journey-evidence"
          mkdir -p "$evidence_root"
          php tests/project-unveiled-analytics/dashboard-evidence.php "$evidence_root/dashboard.html"
          php tests/unveiled-journey/suppression.php
          node tests/project-unveiled-analytics/dashboard-layout.mjs "$evidence_root/dashboard.html" "$evidence_root/browser"

      - name: Preserve synthetic dashboard review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/project-unveiled-journey-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Validate public files and local links
        run: python3 scripts/validate_site.py

      - name: Validate Trust-Worthy release contract
        run: bash tests/trust-worthy-lab/run_all.sh
