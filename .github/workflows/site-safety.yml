name: Site safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit secrets and workflow permissions
        run: python3 scripts/security-audit.py --history

      - name: Validate deployment safety policy
        env:
          DEPLOYMENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-deployment-safety.py --base "${DEPLOYMENT_BASE_SHA:-}"

      - name: Test guarded cPanel deployment
        run: bash tests/deployment/run.sh

      - name: Ensure PHP payment and bundle validation extensions
        shell: bash
        run: |
          set -euo pipefail
          if ! php -r 'exit(extension_loaded("curl") && extension_loaded("mbstring") && class_exists("ZipArchive") ? 0 : 1);'; then
            PHP_RUNTIME_VERSION="$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')"
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "php${PHP_RUNTIME_VERSION}-curl" "php${PHP_RUNTIME_VERSION}-mbstring" "php${PHP_RUNTIME_VERSION}-zip"
          fi
          php -r 'foreach (["curl", "mbstring", "zip"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing required PHP extension: " . $extension . PHP_EOL); exit(1); } } if (!class_exists("ZipArchive")) { exit(1); }'

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path './.git' -prune -o -type f -name '*.php' -print0)

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path './.git' -prune -o -type f -name '*.js' -print0)

      - name: Validate public files and local links
        run: python3 scripts/validate_site.py

      - name: Test service briefs and protected owner inbox
        run: python3 tests/services/contact-flow.py

      - name: Test conversion paths and service form behavior
        run: node tests/services/conversion-flow.mjs

      - name: Test smart-store intent routing and guarded walkthrough actions
        run: node tests/services/smart-store.mjs

      - name: Test deterministic buyer bundle assembly and manifest validation
        run: python3 tests/commerce/bundle-build.py

      - name: Test verified-bundle payment and private delivery controls
        run: php tests/commerce/backend.php

      - name: Validate Trust-Worthy release contract
        run: bash tests/trust-worthy-lab/run_all.sh
